# Stack complete de Zimmplayer, a partir des images publiees sur GHCR (voir
# README.md). Un seul reglage est obligatoire avant de demarrer :
# PUBLIC_BASE_URL doit correspondre exactement a l'adresse tapee par les
# utilisateurs (nom d'hote et port compris). Les URLs audio sont signees pour
# cette adresse ; une valeur erronee fait rejeter la signature par MinIO et
# rien ne se lit.
services:
  web:
    image: ghcr.io/ririmi56/zimmplayer-front:${FRONT_TAG:-latest}
    environment:
      # Doit toujours designer le meme MinIO que S3_ENDPOINT ci-dessous : c'est
      # nginx qui expose /s3 au navigateur, en proxifiant vers cette adresse.
      MINIO_UPSTREAM: ${S3_ENDPOINT:-http://minio:9000}
    depends_on:
      - api
      - minio
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped

  api:
    image: ghcr.io/ririmi56/zimmplayer-back:${BACK_TAG:-latest}
    environment:
      DATABASE_URL: mysql+pymysql://zimmplayer:${DB_PASSWORD:?definir DB_PASSWORD}@mariadb:3306/zimmplayer?charset=utf8mb4
      # Par defaut, le MinIO fourni par ce compose. Surchargeables pour un
      # MinIO deja deploye ailleurs sur le reseau (voir README.md) — dans ce
      # cas, S3_ACCESS_KEY/S3_SECRET_KEY n'ont pas besoin d'etre le compte
      # root : l'appli ne fait jamais que lister et lire le bucket.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?definir PUBLIC_BASE_URL}/s3
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD ou S3_SECRET_KEY}}
      S3_BUCKET: ${S3_BUCKET:-music}
      S3_PREFIX: ${S3_PREFIX:-}
      COVER_DIR: /data/covers
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-8}
      # Snapcast : valeurs par defaut, surchargeables depuis l'ecran de
      # configuration (elles sont alors persistees en base).
      SNAPCAST_ENABLED: ${SNAPCAST_ENABLED:-false}
      SNAPCAST_HOST: ${SNAPCAST_HOST:-}
      SNAPCAST_PORT: ${SNAPCAST_PORT:-1705}
      SNAPCAST_ADVERTISE_HOST: ${SNAPCAST_ADVERTISE_HOST:-}
      SNAPCAST_PORT_START: ${SNAPCAST_PORT_START:-4960}
      SNAPCAST_PORT_COUNT: ${SNAPCAST_PORT_COUNT:-8}
    # Un port par session diffusee : c'est snapserver qui vient s'y connecter,
    # ils doivent donc etre joignables depuis lui.
    ports:
      - "${SNAPCAST_PORT_START:-4960}-${SNAPCAST_PORT_END:-4967}:${SNAPCAST_PORT_START:-4960}-${SNAPCAST_PORT_END:-4967}"
    volumes:
      - covers:/data/covers
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?definir DB_ROOT_PASSWORD}
      MARIADB_DATABASE: zimmplayer
      MARIADB_USER: zimmplayer
      MARIADB_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-ft-min-token-size=2
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD}
    volumes:
      - minio:/data
    # Console d'administration MinIO, volontairement non exposee par defaut.
    # Decommenter pour y acceder depuis le reseau.
    # ports:
    #   - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mariadb:
  minio:
  covers:
