# Stack de Zimmplayer, a partir des images publiees sur GHCR (voir README.md).
#
# Le stockage S3/MinIO n'est PAS fourni ici : le cas normal est un MinIO deja
# present sur le reseau, que l'on renseigne par S3_ENDPOINT / S3_ACCESS_KEY /
# S3_SECRET_KEY. Un MinIO jetable est disponible pour un essai local, derriere
# le profil `minio` (voir tout en bas).
#
# Deux reglages sont obligatoires avant de demarrer :
#   - PUBLIC_BASE_URL doit correspondre exactement a l'adresse tapee par les
#     utilisateurs (nom d'hote et port compris) : les URLs audio sont signees
#     pour cette adresse, une valeur erronee fait rejeter la signature par
#     MinIO et rien ne se lit ;
#   - les identifiants S3 ci-dessus, faute de MinIO fourni par defaut.
services:
  web:
    image: ghcr.io/ririmi56/zimmplayer-front:${FRONT_TAG:-latest}
    environment:
      # Doit toujours designer le meme MinIO que S3_ENDPOINT ci-dessous : c'est
      # nginx qui expose /s3 au navigateur, en proxifiant vers cette adresse.
      MINIO_UPSTREAM: ${S3_ENDPOINT:?definir S3_ENDPOINT}
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped

  api:
    image: ghcr.io/ririmi56/zimmplayer-back:${BACK_TAG:-latest}
    environment:
      DATABASE_URL: mysql+pymysql://zimmplayer:${DB_PASSWORD:?definir DB_PASSWORD}@mariadb:3306/zimmplayer?charset=utf8mb4
      # Le MinIO du reseau. Ces identifiants n'ont pas besoin d'etre ceux du
      # compte root : l'application ne fait jamais que lister et lire le
      # bucket. Pour l'essai local, pointer S3_ENDPOINT sur http://minio:9000
      # et lancer avec `--profile minio`.
      S3_ENDPOINT: ${S3_ENDPOINT:?definir S3_ENDPOINT}
      S3_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?definir PUBLIC_BASE_URL}/s3
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?definir S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?definir S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-music}
      S3_PREFIX: ${S3_PREFIX:-}
      # Region annoncee dans la signature SigV4. MinIO l'accepte telle quelle ;
      # un vrai S3 exige celle du bucket, sans quoi la signature est rejetee.
      S3_REGION: ${S3_REGION:-us-east-1}
      COVER_DIR: /data/covers
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-8}
      # Snapcast : valeurs par defaut, surchargeables depuis l'ecran de
      # configuration (elles sont alors persistees en base).
      SNAPCAST_ENABLED: ${SNAPCAST_ENABLED:-false}
      SNAPCAST_HOST: ${SNAPCAST_HOST:-}
      # Serveur HTTP de snapserver : controle JSON-RPC et audio partagent ce
      # port. Le port de controle TCP 1705 n'est plus utilise.
      SNAPCAST_HTTP_PORT: ${SNAPCAST_HTTP_PORT:-1780}
      SNAPCAST_ADVERTISE_HOST: ${SNAPCAST_ADVERTISE_HOST:-}
      SNAPCAST_PORT_START: ${SNAPCAST_PORT_START:-4960}
      SNAPCAST_PORT_COUNT: ${SNAPCAST_PORT_COUNT:-8}
      # TLS vers snapserver : les seuls reglages Snapcast qui ne sont PAS
      # modifiables a chaud depuis l'ecran de configuration. Si
      # SNAPCAST_TLS_CA_FILE est renseigne, monter aussi le certificat dans ce
      # conteneur (voir README.md).
      SNAPCAST_TLS: ${SNAPCAST_TLS:-false}
      SNAPCAST_TLS_CA_FILE: ${SNAPCAST_TLS_CA_FILE:-}
      SNAPCAST_TLS_SERVER_NAME: ${SNAPCAST_TLS_SERVER_NAME:-}
    # Un port par session diffusee : c'est snapserver qui vient s'y connecter,
    # ils doivent donc etre joignables depuis lui.
    ports:
      - "${SNAPCAST_PORT_START:-4960}-${SNAPCAST_PORT_END:-4967}:${SNAPCAST_PORT_START:-4960}-${SNAPCAST_PORT_END:-4967}"
    volumes:
      - covers:/data/covers
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?definir DB_ROOT_PASSWORD}
      MARIADB_DATABASE: zimmplayer
      MARIADB_USER: zimmplayer
      MARIADB_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-ft-min-token-size=2
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # MinIO jetable, pour essayer la stack sans stockage sous la main. Il n'est
  # PAS demarre par `docker compose up` : il faut le demander explicitement.
  #
  #     docker compose --profile minio up -d
  #
  # Renseigner alors S3_ENDPOINT=http://minio:9000 et des identifiants S3
  # egaux a MINIO_ROOT_USER / MINIO_ROOT_PASSWORD. Le bucket
  # (S3_BUCKET, `music` par defaut) est a creer une fois via la console.
  # En production, ne pas s'en servir : brancher le MinIO du reseau.
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Defauts assumes : ce service ne sert qu'a des essais locaux. Un vrai
      # deploiement n'utilise pas ce bloc.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio:/data
    # Console d'administration MinIO, volontairement non exposee par defaut.
    # Decommenter pour y acceder depuis le reseau.
    # ports:
    #   - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mariadb:
  minio:
  covers:
