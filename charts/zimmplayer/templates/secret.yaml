{{/*
Tout ce qui ne doit pas se lire dans un `kubectl get deployment -o yaml`.

Les mots de passe de la base n'ont pas de valeur par defaut : une chart qui
demarre avec `changeme` finit toujours par tourner en production avec
`changeme`.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zimmplayer.secretName" . }}
  labels:
    {{- include "zimmplayer.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-root-password: {{ required "mariadb.rootPassword est obligatoire" .Values.mariadb.rootPassword | quote }}
  db-password: {{ required "mariadb.password est obligatoire" .Values.mariadb.password | quote }}
  s3-access-key: {{ required "s3.accessKey est obligatoire" .Values.s3.accessKey | quote }}
  s3-secret-key: {{ required "s3.secretKey est obligatoire" .Values.s3.secretKey | quote }}
  {{- if .Values.oidc.enabled }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
  {{- /* L'API refuse de demarrer sans : une cle connue laisserait forger
         l'identite de n'importe qui, donc autant echouer ici, a l'installation. */}}
  session-secret: {{ required "oidc.sessionSecret est obligatoire quand oidc.enabled vaut true" .Values.oidc.sessionSecret | quote }}
  {{- end }}
  # L'URL complete plutot que le seul mot de passe : c'est la forme qu'attend
  # l'API, et la construire ici evite de repandre le mot de passe dans
  # l'environnement du pod en clair.
  database-url: {{ printf "mysql+pymysql://%s:%s@%s:3306/%s?charset=utf8mb4"
    .Values.mariadb.user .Values.mariadb.password
    (printf "%s-mariadb" (include "zimmplayer.fullname" .))
    .Values.mariadb.database | quote }}
